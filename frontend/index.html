<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AtlasForecast - Météo Professionnelle &amp; Prévisions Avancées</title>
  <meta name="description" content="Service météorologique professionnel avec prévisions précises, alertes en temps réel et données climatiques avancées pour le Maroc et le monde" />
  <link rel="icon" type="image/png" href="/images/atlasforecast-logo.png" />
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Pre-React splash: prevents white flash before JS loads -->
  <style>
    #pre-react-splash {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 28px;
      background: linear-gradient(145deg, #050a18 0%, #0a1628 30%, #0f1f3d 60%, #0d1a30 100%);
      font-family: 'Inter', 'Poppins', system-ui, sans-serif;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #pre-react-splash .prs-brand {
      display: flex;
      align-items: center;
      gap: 14px;
      animation: prs-fadeIn 0.6s ease-out both;
    }
    #pre-react-splash .prs-icon {
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(96,165,250,0.2), rgba(99,102,241,0.15));
      border: 1px solid rgba(96,165,250,0.25);
      font-size: 22px;
      color: #60a5fa;
    }
    #pre-react-splash .prs-text {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #e2e8f0, #94a3b8, #60a5fa);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #pre-react-splash .prs-bar {
      width: 200px;
      height: 3px;
      border-radius: 4px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
      animation: prs-fadeIn 0.4s ease-out 0.3s both;
    }
    #pre-react-splash .prs-bar-fill {
      height: 100%;
      width: 30%;
      border-radius: 4px;
      background: linear-gradient(90deg, #3b82f6, #60a5fa, #818cf8);
      animation: prs-slide 1.5s ease-in-out infinite;
    }
    @keyframes prs-fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes prs-slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(700%); }
    }
  </style>
</head>
<body>
  <div id="root">
    <!-- Pre-React splash — React replaces this on mount -->
    <div id="pre-react-splash">
      <div class="prs-brand">
        <div class="prs-icon"><img src="/images/atlasforecast-logo.png" alt="AtlasForecast" style="width:32px;height:32px;object-fit:contain;border-radius:4px;"></div>
        <span class="prs-text">AtlasForecast</span>
      </div>
      <div class="prs-bar"><div class="prs-bar-fill"></div></div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
  <!-- Leaflet JS for maps -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Chart.js for weather graphs -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Weather API Scripts -->
  <script src="/js/script.js" defer></script>
  <script src="/js/nasa-gibs-api.js" defer></script>
</body>
</html>
